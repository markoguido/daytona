<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daytona Morelia</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="contenedor">

        <header>

            <div class="logo">
                <img id="logo-negocio" src="Logo.png" alt="Logo">
            </div>

            <h1 id="nombre-negocio">Daytona Morelia</h1>

<p id="descripcion-negocio">
    Todo para tu vehículo automotor.
</p>

            <div id="estado-negocio"></div>

            <div id="horario-negocio">
    <p><strong>Lunes:</strong> <span id="lunes"></span></p>
    <p><strong>Martes:</strong> <span id="martes"></span></p>
    <p><strong>Miércoles:</strong> <span id="miercoles"></span></p>
    <p><strong>Jueves:</strong> <span id="jueves"></span></p>
    <p><strong>Viernes:</strong> <span id="viernes"></span></p>
    <p><strong>Sábado:</strong> <span id="sabado"></span></p>
    <p><strong>Domingo:</strong> <span id="domingo"></span></p>
</div>

<section id="seccion-servicios">

    <h2>Servicios</h2>

    <div id="lista-servicios"></div>

</section>

<img id="imagen-negocio" src="foto.jpg" alt="Daytona Morelia">

        </header>

        <main>

            <a id="boton-whatsapp" href="#" class="boton" target="_blank" rel="noopener noreferrer">
    <i class="fa-brands fa-whatsapp"></i>
    <span>WhatsApp</span>
</a>

<a id="boton-llamar" href="#" class="boton">
        <i class="fa-solid fa-phone"></i>
        <span>Llamar</span>
    </a>

<a id="boton-maps" href="#" class="boton" target="_blank" rel="noopener noreferrer">
    <i class="fa-solid fa-location-dot"></i>
    <span>Cómo llegar</span>
</a>

<a id="boton-instagram" href="#" class="boton" target="_blank" rel="noopener noreferrer">
    <i class="fa-brands fa-instagram"></i>
    <span>Instagram</span>
</a>

<a id="boton-resenas" href="#" class="boton" target="_blank" rel="noopener noreferrer">
    <i class="fa-solid fa-star"></i>
    <span>Déjanos una reseña</span>
</a>

        </main>

        <footer>
            <p>Creado por EFITEM</p>
        </footer>

    </div>

    <script src="datos.js"></script>
    <script src="script.js"></script>

</body>

</html>
